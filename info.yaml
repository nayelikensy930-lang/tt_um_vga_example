# Tiny Tapeout project information

project:
  title:       "VGA Bouncing Logo"
  author:      "jazmin rivas / kensy bautista"
  discord:     ""
  description: "Bouncing 128x128 pixel logo on a 640x480 VGA display with color palette cycling on each wall bounce."
  language:    "Verilog"
  clock_hz:    25175000

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module: "tt_um_vga_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_vga_example.v"
    - "hvsync_generator.v"
    - "bitmap_rom.v"
    - "palette.v"

  # The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
  # This section is for the datasheet/website. Use descriptive names.
  pinout:
    # Inputs
    ui[0]: "cfg_tile"
    ui[1]: "cfg_color"
    ui[2]: ""
    ui[3]: ""
    ui[4]: ""
    ui[5]: ""
    ui[6]: ""
    ui[7]: ""

    # Outputs
    uo[0]: "R[1]"
    uo[1]: "G[1]"
    uo[2]: "B[1]"
    uo[3]: "vsync"
    uo[4]: "R[0]"
    uo[5]: "G[0]"
    uo[6]: "B[0]"
    uo[7]: "hsync"

    # Bidirectional pins
    uio[0]: ""
    uio[1]: ""
    uio[2]: ""
    uio[3]: ""
    uio[4]: ""
    uio[5]: ""
    uio[6]: ""
    uio[7]: ""

# Do not change!
yaml_version: 6
